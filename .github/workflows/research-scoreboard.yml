# The research scoreboard (Royce, 2026-10-07), run by hand: the general reader on 12 hand-checked sites (api/evals/browserPilot/round2.ts), Haiku 5.5, about
# $0.02 a run, capped at $0.50. It fails on ANY confident-wrong answer, on right answers more than 2 under the baseline, or when
# the hand-checked truth has gone stale (re-check it and update round2.ts + baseline.json).
name: research-scoreboard
on:
  # Manual only (Royce, 2026-10-07): run it from the Actions tab or `gh workflow run research-scoreboard.yml`
  # after changing a reader or extraction. It no longer runs on pushes or PRs, so stale hand-checked truth never blocks anything.
  workflow_dispatch: {}
jobs:
  scoreboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # GitHub's Ubuntu runners ship Google Chrome here (services/browserRead.ts chromiumPath reads this).
      CHROMIUM_PATH: /usr/bin/google-chrome
      SENDBLUE_API_KEY: ci
      SENDBLUE_SECRET_KEY: ci
      OPENAI_API_KEY: ci
      GOOGLE_PLACES_API_KEY: ci
      RESEND_API_KEY: re_ci
      ELEVENLABS_API_KEY: ci
      DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
      EVAL_REAL_MODELS: "1"
      EVAL_COST_CAP_USD: "0.50"
      EVAL_TOKEN_CAP: "3000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run -s eval:live -- evals/browserPilot/round2.ts
