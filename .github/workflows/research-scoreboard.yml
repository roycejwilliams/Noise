# The research scoreboard as a standing eval (Royce, 2026-10-07: "any change to readers or extraction re-runs it, and a
# regression blocks the merge like a failing test"). The one live run allowed on a push or PR, and only when a reader or
# extraction file changes: the general reader on 12 hand-checked sites (api/evals/browserPilot/round2.ts), Haiku 5.5, about
# $0.02 a run, capped at $0.50. It fails on ANY confident-wrong answer, on right answers more than 2 under the baseline, or when
# the hand-checked truth has gone stale (re-check it and update round2.ts + baseline.json).
# Make "scoreboard" a required check on co-test / main for it to block the merge.
name: research-scoreboard
on:
  pull_request:
    paths:
      - "api/src/services/sdkGeneralReader.ts"
      - "api/src/services/sdkBrowserReader.ts"
      - "api/src/services/peerspaceSlot.ts"
      - "api/src/services/browserRead.ts"
      - "api/src/services/researchQuality.ts"
      - "api/src/services/researchBrief.ts"
      - "api/src/services/taskWeb.ts"
      - "api/src/models.ts"
      - "api/evals/browserPilot/**"
  push:
    paths:
      - "api/src/services/sdkGeneralReader.ts"
      - "api/src/services/researchQuality.ts"
      - "api/src/services/researchBrief.ts"
      - "api/evals/browserPilot/**"
  workflow_dispatch: {}
jobs:
  scoreboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # GitHub's Ubuntu runners ship Google Chrome here (services/browserRead.ts chromiumPath reads this).
      CHROMIUM_PATH: /usr/bin/google-chrome
      SENDBLUE_API_KEY: ci
      SENDBLUE_SECRET_KEY: ci
      OPENAI_API_KEY: ci
      GOOGLE_PLACES_API_KEY: ci
      RESEND_API_KEY: re_ci
      ELEVENLABS_API_KEY: ci
      DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
      EVAL_REAL_MODELS: "1"
      EVAL_COST_CAP_USD: "0.50"
      EVAL_TOKEN_CAP: "3000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run -s eval:live -- evals/browserPilot/round2.ts
