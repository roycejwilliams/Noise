<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Co (test) — Sign in</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="app-name">Co (test)</div>
      <p id="login-status" class="status-line">Text Co from your phone to sign in.</p>

      <a id="text-co-button" href="#" class="download-button button-primary login-text-co" aria-disabled="true">Text Co</a>
      <p id="login-waiting" class="phone-waiting hidden">Waiting for your text… <span class="login-spinner">●</span></p>

      <p class="login-desktop">If Messages doesn't open, open this page on your phone.</p>
      <p id="login-error" class="phone-error hidden"></p>
    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
