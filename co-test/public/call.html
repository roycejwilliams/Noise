<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Co — EVI Test Console</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <nav id="sidebar" class="sidebar"></nav>
    <div class="app-main">
      <header class="app-header">
        <div class="header-title">
          <div class="app-name">Co (test)</div>
          <div id="status" class="status-line">Not connected</div>
        </div>
        <div class="header-actions">
          <button id="transcript-toggle" class="transcript-toggle">
            Transcript <span class="chevron">⌄</span>
          </button>
        </div>
      </header>

      <main class="scroll-area">
        <div class="content-row">
          <div class="dashboard-card">
            <div id="transcript-panel" class="transcript-panel">
              <div id="transcript-list" class="transcript-list"></div>
            </div>
          </div>
          <aside id="coverage-panel" class="coverage-panel">
            <div class="coverage-panel-header">Coverage check</div>
            <div id="coverage-panel-body">
              <div class="coverage-empty">No tool calls yet</div>
            </div>
          </aside>
        </div>
      </main>

      <footer class="control-bar-wrap">
        <div id="prompt-mode-label" class="prompt-mode-label">Checking prompt…</div>
        <div class="control-bar">
        <div id="timer" class="timer">00:00</div>
        <div id="waveform" class="waveform"></div>
        <div class="control-buttons">
          <button id="mute-button" class="icon-button" aria-pressed="false" title="Mute microphone">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button id="speaker-button" class="icon-button" aria-pressed="false" title="Mute speaker">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="4 9 9 9 13 5 13 19 9 15 4 15 4 9"/>
              <path d="M17 8a5 5 0 0 1 0 8"/>
            </svg>
          </button>
          <button id="call-button" class="call-button" title="Start call" aria-label="Start call" aria-pressed="false">
            <svg class="call-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M6.6 10.8c1.5 3 3.9 5.4 6.9 6.9l2.3-2.3c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V21c0 .6-.4 1-1 1C10.1 22 2 13.9 2 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.2 1.1L6.6 10.8z"/>
            </svg>
          </button>
        </div>
        </div>
      </footer>
    </div>
  </div>

  <script src="/call.js"></script>
</body>
</html>
