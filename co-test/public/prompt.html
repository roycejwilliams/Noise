<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cue — Prompt</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <nav id="sidebar" class="sidebar"></nav>
    <div class="app-main">
      <header class="app-header">
        <div class="header-title">
          <div class="app-name">Cue (test) — Prompt</div>
          <div id="status" class="status-line">Loading…</div>
        </div>
      </header>

      <main class="scroll-area">
    <div class="prompt-page">
      <p class="prompt-explainer">
        This is Cue's call prompt (<span id="config-meta">—</span>), the same text Cue's ElevenLabs
        call agent and Cue's texts use. To change it, edit that file and run
        <code>npx tsx src/scripts/pushElevenLabsAgent.ts</code>.
      </p>

      <textarea
        id="prompt-textarea"
        class="prompt-textarea"
        spellcheck="false"
        readonly
        placeholder="Loading prompt…"
      ></textarea>
    </div>
      </main>
    </div>
  </div>

  <script src="/prompt.js"></script>
</body>
</html>
