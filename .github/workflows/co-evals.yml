# Two layers (api/evals/README.md; Royce, 2026-10-06: cut the API spend).
# code  = LAYER 1, every push and PR that touches api/: typecheck, the voice check and every logic test with the model
#         fully stubbed. Zero tokens, no secrets needed.
# golden = GOLDEN conversations (api/evals/golden), every PR into co-test: REPLAYED from committed recordings, no API key, zero
#          model calls (Royce, 2026-10-14: "golden cases must not hit the live API on every CI run").
# golden-live = the same cases against the real models ($4 cap, cost printed), ONLY on a manual dispatch with golden_live ticked.
# live  = LAYER 2, nightly or when asked, NEVER on a push or PR: a small sample of the highest-signal cases, Haiku for
#         everything and Sonnet only for grading, a hard token/dollar cap, and the run's cost printed at the end.
#         Needs ANTHROPIC_API_KEY.
name: co-evals
# co-test's Railway service has "Wait for CI" on, so a failing run here
# blocks the co-test deploy (co-test builds from both api/ and co-test/).
on:
  push:
    paths: ["api/**", "co-test/**", ".github/workflows/co-evals.yml"]
  pull_request:
    paths: ["api/**", "co-test/**"]
  # Nightly live evals (layer 2), only when api/ changed in the last day, capped (evals/live.json).
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Run the capped live evals (layer 2). Real, paid calls: Haiku, a hard cap, cost printed."
        type: boolean
        default: false
      only:
        description: "Only these suites (comma-separated, e.g. router,intro). Blank = the nightly set."
        type: string
        default: ""
      golden_live:
        description: "Run the golden cases against the real models (drift check). Real, paid calls: $4 cap, cost printed, nothing recorded."
        type: boolean
        default: false
      golden_only:
        description: "Only these golden cases (ids or numbers, comma-separated). Blank = all."
        type: string
        default: ""
jobs:
  code:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Placeholders: clients read these at import, but code-only evals never
      # call out.
      SENDBLUE_API_KEY: ci
      SENDBLUE_SECRET_KEY: ci
      ANTHROPIC_API_KEY: ci
      OPENAI_API_KEY: ci
      GOOGLE_PLACES_API_KEY: ci
      RESEND_API_KEY: re_ci
      ELEVENLABS_API_KEY: ci
      DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run -s evals:code
  # GOLDEN conversations (api/evals/golden; Royce, 2026-10-13: "same command runs locally and is required in pre-merge CI").
  # Every PR into co-test (a required check), replayed from api/evals/golden/recordings: every model call is answered from a
  # committed recording and a call with no recording fails its case; nothing reaches the network. No API key in this job, on purpose
  # (Royce, 2026-10-14: "Live API runs only on a deliberate manual trigger ... never automatically per PR").
  golden:
    if: github.event_name == 'pull_request' && github.base_ref == 'co-test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    env:
      OPENAI_API_KEY: ci
      GOOGLE_PLACES_API_KEY: ci
      ELEVENLABS_API_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run -s evals:golden
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-results
          path: api/evals/golden/last.local.json
          if-no-files-found: ignore
  # The golden cases against the real models, nothing recorded: a manual drift check, run by hand from the Actions tab with
  # golden_live ticked. Real, paid calls through the meter, $4 cap, cost printed. Never on a push, a PR or a schedule.
  golden-live:
    if: github.event_name == 'workflow_dispatch' && inputs.golden_live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ci
      GOOGLE_PLACES_API_KEY: ci
      ELEVENLABS_API_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # The input goes through the environment, never into the command line (no shell injection from a dispatch input).
      - env:
          GOLDEN_ONLY: ${{ inputs.golden_only }}
        run: |
          if [ -n "$GOLDEN_ONLY" ]; then npm run -s evals:golden:live -- --only "$GOLDEN_ONLY"; else npm run -s evals:golden:live; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-live-results
          path: api/evals/golden/last.local.json
          if-no-files-found: ignore
  live:
    if: (github.event_name == 'workflow_dispatch' && inputs.live) || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SENDBLUE_API_KEY: ci
      SENDBLUE_SECRET_KEY: ci
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_PLACES_API_KEY: ci
      RESEND_API_KEY: re_ci
      ELEVENLABS_API_KEY: ci
      DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - id: changed
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ -n "$(git log --since='26 hours ago' --format=%H -- api)" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true'
        # The input goes through the environment, never into the command line (no shell injection from a dispatch input).
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then npm run -s evals:nightly -- --only "$ONLY"; else npm run -s evals:nightly; fi
